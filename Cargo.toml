[workspace]
resolver = "2"
members = [
    "crates/ycode-adapter",
    "crates/ycode-acp-adapter",
    "crates/ycode-pty-adapter",
    "crates/ycode-echo-adapter",
    "crates/ycode-core",
    "crates/ycode-worktree",
    "crates/ycode-persist",
    "crates/ycode-config",
    "crates/ycode-ipc",
    "crates/ycode-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ts-rs = { version = "10", features = ["serde-compat"] }

# Errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs / time
ulid = { version = "1.1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }

# Filesystem / paths
directories = "5"
camino = { version = "1.1", features = ["serde1"] }

# Git
gix = { version = "0.66", default-features = false, features = ["max-performance-safe"] }

# Process / PTY
portable-pty = "0.8"
vt100 = "0.15"
regex = "1.10"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Internal crates
ycode-adapter = { path = "crates/ycode-adapter" }
ycode-acp-adapter = { path = "crates/ycode-acp-adapter" }
ycode-pty-adapter = { path = "crates/ycode-pty-adapter" }
ycode-echo-adapter = { path = "crates/ycode-echo-adapter" }
ycode-core = { path = "crates/ycode-core" }
ycode-worktree = { path = "crates/ycode-worktree" }
ycode-persist = { path = "crates/ycode-persist" }
ycode-config = { path = "crates/ycode-config" }
ycode-ipc = { path = "crates/ycode-ipc" }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
