[workspace]
resolver = "2"
members = [
    "crates/ycode-terminal",
    "crates/ycode-persist",
    "crates/ycode-config",
    "crates/ycode-ipc",
    "crates/ycode-introspect",
    "crates/ycode-lsp",
    "crates/ycode-notify",
    "crates/ycode-mcp",
    "src-tauri",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ts-rs = { version = "10", features = ["serde-compat"] }

# Errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs / time
ulid = { version = "1.1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }

# Filesystem / paths
directories = "5"
camino = { version = "1.1", features = ["serde1"] }

# Process / PTY
portable-pty = "0.8"

# Filesystem walking
ignore = "0.4"

# Filesystem watching
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

# Internal crates
ycode-terminal = { path = "crates/ycode-terminal" }
ycode-persist = { path = "crates/ycode-persist" }
ycode-config = { path = "crates/ycode-config" }
ycode-ipc = { path = "crates/ycode-ipc" }
ycode-introspect = { path = "crates/ycode-introspect" }
ycode-lsp = { path = "crates/ycode-lsp" }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
