name: macOS Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag matching macos/VERSION, e.g. v0.7.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ycode-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate stable tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate version and release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "v$(cat macos/VERSION)" == "$RELEASE_TAG" ]] || { echo 'Tag must match macos/VERSION'; exit 1; }
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          python3 macos/scripts/check_release_version.py "$RELEASE_TAG" "$GH_REPO"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Check required secrets
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing release credential: $name (see docs/macos-native/github-release.md)"; exit 1; }
          done
      - name: Run tests
        run: |
          swift test --package-path macos --force-resolved-versions
          python3 -m unittest discover -s macos/scripts/tests -v
          python3 macos/scripts/generate_agent_icons.py
          python3 macos/scripts/generate_file_icons.py
          git diff --exit-code -- macos/YCodeApp/Sources/YCodeApp/YCodeAgentIcons.swift macos/YCodeApp/Sources/YCodeApp/YCodeFileIcons.swift
      - name: Import signing certificate and notarization credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash macos/scripts/ci_signing_setup.sh
      - name: Build, notarize and verify universal app
        env:
          NOTARY_PROFILE: ycode-ci-notary
          UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
        run: bash macos/scripts/package_release.sh release
      - name: Generate and verify signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/ycode-sparkle.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          SPARKLE_PRIVATE_KEY_FILE="$key_file" bash macos/scripts/generate_appcast.sh \
            macos/dist/release/YCode.app "macos/dist/release/YCode-$VERSION.zip" "$GH_REPO"
          cd macos/dist/release
          shasum -a 256 "YCode-$VERSION.zip" appcast.xml > SHA256SUMS
      - name: Upload verified assets to draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never replace assets of a public release; a retry may reuse only its draft.
          python3 macos/scripts/check_release_version.py "$RELEASE_TAG" "$GH_REPO"
          if ! gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/ycode-release.json" 2>/dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "YCode $VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "macos/dist/release/YCode-$VERSION.zip" macos/dist/release/appcast.xml macos/dist/release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YCode-notarized-release
          path: |
            macos/dist/release/YCode-*.zip
            macos/dist/release/appcast.xml
            macos/dist/release/SHA256SUMS
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ycode-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ycode-certificate.p12" "$RUNNER_TEMP/ycode-sparkle.key"
