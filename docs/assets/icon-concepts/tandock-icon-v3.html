<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandock Icon v3</title>
<style>
  :root { --bg: #f4f1ec; --fg: #121826; --muted: #6b6f80; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --fg: #eef0f6; --muted: #9298ab; --card: #1c1f27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .hero { display: flex; justify-content: center; margin-bottom: 24px; }
  #icon { width: min(420px, 100%); height: auto; }
  .sizes { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: center;
           padding: 20px; border-radius: 14px; background: var(--card); margin-bottom: 16px; }
  .sizes figure { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
  .sizes.light { background: #ffffff; }
  .sizes.dark { background: #1d1d22; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--muted);
           background: var(--card); color: var(--fg); cursor: pointer; }
  button:focus-visible { outline: 2px solid #7c8cff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Tandock · 方案 v3</h1>
  <p>沿用 v2 配色。蓝、绿两半像接头一样咬合成一个圆（tandem），蓝半边的圆形卡榫插进绿半边的卡槽；外圈米白色的环是 dock，右上方留了个缺口。</p>
  <div class="hero"><canvas id="icon" width="1024" height="1024" aria-label="Tandock 应用图标 v3"></canvas></div>
  <div class="sizes light" id="light"></div>
  <div class="sizes dark" id="dark"></div>
  <div class="actions">
    <button id="dl1024">下载 1024 PNG</button>
    <button id="dlset">下载 iconset 全部尺寸</button>
  </div>
</main>
<script>
const COLORS = {
  skyTop: '#2a3256',
  skyBottom: '#0f1424',
  cradle: '#f4f1e8',
  cradleShade: '#d9d4c6',
  blueTop: '#7d93ff',
  blueBottom: '#4b63f0',
  limeTop: '#e2ff8a',
  limeBottom: '#a9e84a',
};

// Continuous-curvature rounded rect on the macOS icon grid (824pt body inside 1024).
function squircle(ctx, x, y, w, h, r) {
  const q = r * (1 - 0.62);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.bezierCurveTo(x + w - q, y, x + w, y + q, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.bezierCurveTo(x + w, y + h - q, x + w - q, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.bezierCurveTo(x + q, y + h, x, y + h - q, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.bezierCurveTo(x, y + q, x + q, y, x + r, y);
  ctx.closePath();
}

function vgrad(ctx, y0, y1, top, bottom) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  return g;
}

// Paints into an offscreen layer so cut-outs (destination-out) never touch the background.
function layer(size, paint) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.setTransform(size / 1024, 0, 0, size / 1024, 0, 0);
  paint(ctx);
  return c;
}

const CX = 512, CY = 512;
const DISC_R = 232;   // the two docked halves together form this disc
const SEAM = 26;      // gap between the halves
const TAB_R = 66;     // the connector tab on the blue half
const TAB_X = CX + 34; // tab centre sits just past the seam, into the lime half

function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const s = size / 1024;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.clearRect(0, 0, 1024, 1024);

  // Body.
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 12;
  squircle(ctx, 100, 100, 824, 824, 186);
  ctx.fillStyle = vgrad(ctx, 100, 924, COLORS.skyTop, COLORS.skyBottom);
  ctx.fill();
  ctx.restore();

  ctx.save();
  squircle(ctx, 100, 100, 824, 824, 186);
  ctx.clip();
  const halo = ctx.createRadialGradient(CX, CY, 40, CX, CY, 420);
  halo.addColorStop(0, 'rgba(140, 160, 255, 0.30)');
  halo.addColorStop(1, 'rgba(140, 160, 255, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(100, 100, 824, 824);
  ctx.restore();

  // Dock: a cream ring around the disc, open at the upper right where the lime half came in.
  ctx.save();
  ctx.shadowColor = 'rgba(5, 8, 20, 0.45)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 10;
  ctx.lineWidth = 46;
  ctx.lineCap = 'round';
  ctx.strokeStyle = vgrad(ctx, CY - 330, CY + 330, COLORS.cradle, COLORS.cradleShade);
  ctx.beginPath();
  ctx.arc(CX, CY, DISC_R + 70, -Math.PI * 0.12, -Math.PI * 0.38, false);
  ctx.stroke();
  ctx.restore();

  // Blue half: left semicircle plus the round connector tab poking across the seam.
  const blue = layer(size, c => {
    c.beginPath();
    c.arc(CX, CY, DISC_R, 0, Math.PI * 2);
    c.clip();
    c.fillStyle = vgrad(c, CY - DISC_R, CY + DISC_R, COLORS.blueTop, COLORS.blueBottom);
    c.fillRect(CX - DISC_R, CY - DISC_R, DISC_R - SEAM / 2, DISC_R * 2);
    c.beginPath();
    c.arc(TAB_X, CY, TAB_R, 0, Math.PI * 2);
    c.fill();
  });

  // Lime half: right semicircle with a socket cut to fit the tab, keeping the seam width.
  const lime = layer(size, c => {
    c.beginPath();
    c.arc(CX, CY, DISC_R, 0, Math.PI * 2);
    c.clip();
    c.fillStyle = vgrad(c, CY - DISC_R, CY + DISC_R, COLORS.limeTop, COLORS.limeBottom);
    c.fillRect(CX + SEAM / 2, CY - DISC_R, DISC_R, DISC_R * 2);
    c.globalCompositeOperation = 'destination-out';
    c.beginPath();
    c.arc(TAB_X, CY, TAB_R + SEAM, 0, Math.PI * 2);
    c.fill();
  });

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.shadowColor = 'rgba(5, 8, 20, 0.5)';
  ctx.shadowBlur = 34 * s;
  ctx.shadowOffsetY = 16 * s;
  ctx.drawImage(blue, 0, 0);
  ctx.drawImage(lime, 0, 0);
  ctx.restore();

  // Top-edge sheen across the whole disc so the halves read as one solid object.
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, DISC_R, 0, Math.PI * 2);
  ctx.clip();
  const sheen = ctx.createLinearGradient(0, CY - DISC_R, 0, CY);
  sheen.addColorStop(0, 'rgba(255,255,255,0.22)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = sheen;
  ctx.fillRect(CX - DISC_R, CY - DISC_R, DISC_R * 2, DISC_R);
  ctx.restore();
}

function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  drawIcon(c);
  return c;
}

function download(canvas, name) {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

drawIcon(document.getElementById('icon'));

for (const id of ['light', 'dark']) {
  const row = document.getElementById(id);
  for (const size of [16, 32, 64, 128, 256]) {
    const fig = document.createElement('figure');
    const c = makeCanvas(size * devicePixelRatio);
    c.style.width = c.style.height = size + 'px';
    fig.append(c, Object.assign(document.createElement('figcaption'), { textContent: size + 'px' }));
    row.append(fig);
  }
}

document.getElementById('dl1024').onclick = () => download(makeCanvas(1024), 'tandock-v3-1024.png');
document.getElementById('dlset').onclick = () => {
  for (const base of [16, 32, 128, 256, 512]) {
    download(makeCanvas(base), `icon_${base}x${base}.png`);
    download(makeCanvas(base * 2), `icon_${base}x${base}@2x.png`);
  }
};
</script>
</body>
</html>
