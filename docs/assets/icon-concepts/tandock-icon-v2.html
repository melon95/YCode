<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandock Icon v2</title>
<style>
  :root { --bg: #f4f1ec; --fg: #121826; --muted: #6b6f80; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --fg: #eef0f6; --muted: #9298ab; --card: #1c1f27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .hero { display: flex; justify-content: center; margin-bottom: 24px; }
  #icon { width: min(420px, 100%); height: auto; }
  .sizes { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: center;
           padding: 20px; border-radius: 14px; background: var(--card); margin-bottom: 16px; }
  .sizes figure { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
  .sizes.light { background: #ffffff; }
  .sizes.dark { background: #1d1d22; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--muted);
           background: var(--card); color: var(--fg); cursor: pointer; }
  button:focus-visible { outline: 2px solid #7c8cff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Tandock · 方案 v2</h1>
  <p>一个托架（dock）稳稳托住两块并排的模块（tandem）：左边一块已落位，右边一块正在滑入。不沿用旧图标的任何元素。</p>
  <div class="hero"><canvas id="icon" width="1024" height="1024" aria-label="Tandock 应用图标 v2"></canvas></div>
  <div class="sizes light" id="light"></div>
  <div class="sizes dark" id="dark"></div>
  <div class="actions">
    <button id="dl1024">下载 1024 PNG</button>
    <button id="dlset">下载 iconset 全部尺寸</button>
  </div>
</main>
<script>
const COLORS = {
  skyTop: '#2a3256',
  skyBottom: '#0f1424',
  cradle: '#f4f1e8',
  cradleShade: '#d9d4c6',
  blueTop: '#7d93ff',
  blueBottom: '#4b63f0',
  limeTop: '#e2ff8a',
  limeBottom: '#a9e84a',
};

// Continuous-curvature rounded rect on the macOS icon grid (824pt body inside 1024).
function squircle(ctx, x, y, w, h, r) {
  const q = r * (1 - 0.62);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.bezierCurveTo(x + w - q, y, x + w, y + q, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.bezierCurveTo(x + w, y + h - q, x + w - q, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.bezierCurveTo(x + q, y + h, x, y + h - q, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.bezierCurveTo(x, y + q, x + q, y, x + r, y);
  ctx.closePath();
}

function vgrad(ctx, y0, y1, top, bottom) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  return g;
}

// A docked module: rounded tile with a light inner rim on top so it reads as a physical block.
function tile(ctx, x, y, size, top, bottom) {
  ctx.save();
  ctx.shadowColor = 'rgba(5, 8, 20, 0.45)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 14;
  squircle(ctx, x, y, size, size, size * 0.26);
  ctx.fillStyle = vgrad(ctx, y, y + size, top, bottom);
  ctx.fill();
  ctx.restore();

  ctx.save();
  squircle(ctx, x, y, size, size, size * 0.26);
  ctx.clip();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
  ctx.fillRect(x, y, size, size * 0.06);
  ctx.restore();
}

// The cradle: a thick U whose inner floor the tiles sit on.
function cradle(ctx) {
  const x = 236, y = 420, w = 552, h = 300, wall = 64, r = 96;
  ctx.save();
  ctx.shadowColor = 'rgba(5, 8, 20, 0.5)';
  ctx.shadowBlur = 36;
  ctx.shadowOffsetY = 18;
  ctx.beginPath();
  // Outer contour, clockwise: top-left lip → down → bottom → up → top-right lip.
  ctx.moveTo(x, y + wall / 2);
  ctx.arc(x + wall / 2, y + wall / 2, wall / 2, Math.PI, 0);
  ctx.lineTo(x + wall, y + h - wall - r + wall);
  ctx.arcTo(x + wall, y + h - wall, x + wall + r - wall, y + h - wall, r - wall);
  ctx.lineTo(x + w - wall - (r - wall), y + h - wall);
  ctx.arcTo(x + w - wall, y + h - wall, x + w - wall, y + h - wall - (r - wall), r - wall);
  ctx.lineTo(x + w - wall, y + wall / 2);
  ctx.arc(x + w - wall / 2, y + wall / 2, wall / 2, Math.PI, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.closePath();
  ctx.fillStyle = vgrad(ctx, y, y + h, COLORS.cradle, COLORS.cradleShade);
  ctx.fill();
  ctx.restore();
  return { floor: y + h - wall, innerLeft: x + wall, innerRight: x + w - wall };
}

function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width / 1024;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.clearRect(0, 0, 1024, 1024);

  // Body.
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 12;
  squircle(ctx, 100, 100, 824, 824, 186);
  ctx.fillStyle = vgrad(ctx, 100, 924, COLORS.skyTop, COLORS.skyBottom);
  ctx.fill();
  ctx.restore();

  // Soft halo behind the dock so the modules feel lit from below.
  ctx.save();
  squircle(ctx, 100, 100, 824, 824, 186);
  ctx.clip();
  const halo = ctx.createRadialGradient(512, 550, 20, 512, 550, 380);
  halo.addColorStop(0, 'rgba(140, 160, 255, 0.35)');
  halo.addColorStop(1, 'rgba(140, 160, 255, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(100, 100, 824, 824);
  ctx.restore();

  const dock = cradle(ctx);
  const size = 196, gap = 28;
  const leftX = dock.innerLeft + 24;
  // Left module already seated on the floor.
  tile(ctx, leftX, dock.floor - size, size, COLORS.blueTop, COLORS.blueBottom);
  // Right module hovering above its slot, still sliding in.
  tile(ctx, leftX + size + gap, dock.floor - size - 150, size, COLORS.limeTop, COLORS.limeBottom);

  // Motion cue: the empty slot the lime module is heading into.
  ctx.save();
  ctx.setLineDash([22, 18]);
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(226, 255, 138, 0.55)';
  squircle(ctx, leftX + size + gap + 5, dock.floor - size + 5, size - 10, size - 10, (size - 10) * 0.26);
  ctx.stroke();
  ctx.restore();
}

function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  drawIcon(c);
  return c;
}

function download(canvas, name) {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

drawIcon(document.getElementById('icon'));

for (const id of ['light', 'dark']) {
  const row = document.getElementById(id);
  for (const size of [16, 32, 64, 128, 256]) {
    const fig = document.createElement('figure');
    const c = makeCanvas(size * devicePixelRatio);
    c.style.width = c.style.height = size + 'px';
    fig.append(c, Object.assign(document.createElement('figcaption'), { textContent: size + 'px' }));
    row.append(fig);
  }
}

document.getElementById('dl1024').onclick = () => download(makeCanvas(1024), 'tandock-v2-1024.png');
document.getElementById('dlset').onclick = () => {
  for (const base of [16, 32, 128, 256, 512]) {
    download(makeCanvas(base), `icon_${base}x${base}.png`);
    download(makeCanvas(base * 2), `icon_${base}x${base}@2x.png`);
  }
};
</script>
</body>
</html>
