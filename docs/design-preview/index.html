<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sessions=[{id:1,name:'完善会话工作区',project:'Tandock',agent:'Claude Code',status:'running',pin:true,time:'现在'},{id:2,name:'检查终端布局',project:'Tandock',agent:'Codex',status:'wait',pin:true,time:'12 分钟'},{id:3,name:'梳理文件浏览交互',project:'Tandock',agent:'Claude Code',status:'idle',time:'1 小时'},{id:4,name:'优化提醒设置',project:'BlinkFar',agent:'Codex',status:'idle',time:'2 小时'},{id:5,name:'更新项目文档',project:'Tandock',agent:'Pi',status:'idle',time:'昨天'},{id:6,name:'调整菜单栏图标',project:'BlinkFar',agent:'Claude Code',status:'idle',time:'昨天'}];
const sampleSessions=sessions.map(s=>({...s}));
let state={empty:location.hash==='#empty',projects:['Tandock','BlinkFar'],active:null,visible:[],picker:true,layout:'single',panels:[],project:'Tandock',branch:'main',worktree:false,filter:false,file:'WorkspaceSidebarView.swift'};
const collapsedProjects=new Set(['BlinkFar']);
let toastTimer,returnFocus;
const panelDefs=[['files','file','文件'],['changes','changes','变更'],['todo','todo','待办'],['terminal','terminal','终端']];
function row(s){return `<button class="session ${state.visible.includes(s.id)?'active':''}" data-session="${s.id}" aria-label="${esc(s.name)} · ${s.agent}" title="${esc(s.project)} · ${s.agent} · ${s.status==='running'?'运行中':s.status==='wait'?'等待输入':'未运行'}"><span class="badge-wrap"><span class="project-badge ${s.project==='BlinkFar'?'blue':''}">${s.project==='Tandock'?'Y':'B'}</span>${s.status==='idle'?'':`<span class="dot ${s.status==='wait'?'wait':''}"></span>`}</span><span class="name">${esc(s.name)}</span><span class="elapsed">${s.time}</span></button>`}
function renderSidebar(){if(state.empty){$('#sidebar-content').innerHTML='';return}const query=$('#session-search').value.toLowerCase();const matches=s=>(s.name+' '+s.project+' '+s.agent).toLowerCase().includes(query)&&(!state.filter||s.status!=='idle');const oldCollapsed=new Set($$('.section.collapsed').map(x=>x.dataset.section));const section=(key,title,content,actions='')=>`<section class="section ${oldCollapsed.has(key)?'collapsed':''}" data-section="${key}"><div class="section-title"><button class="section-toggle" aria-expanded="${!oldCollapsed.has(key)}" data-collapse="${key}">${title}${icon('chevron')}</button>${actions}</div><div class="section-content">${content||('<div class="no-results">'+(query?'没有匹配的会话':'暂无会话')+'</div>')}</div></section>`;$('#sidebar-content').innerHTML=section('pinned','置顶',sessions.filter(s=>s.pin&&matches(s)).map(row).join(''))+section('projects','项目',state.projects.map(p=>`<button class="project-row" data-project="${p}">${icon('folder')}<span>${p}</span>${icon('chevron')}</button><div class="project-sessions" data-project-rows="${p}" ${collapsedProjects.has(p)?'hidden':''}>${sessions.filter(s=>s.project===p&&matches(s)).map(row).join('')}</div>`).join(''))+section('recent','最近',sessions.filter(s=>!s.pin&&matches(s)).map(row).join(''),`<button class="icon ${state.filter?'on':''}" data-action="filter" aria-label="${state.filter?'显示全部会话':'只看运行中和等待输入的会话'}" title="会话过滤">${icon('filter')}</button><button class="icon" data-action="new" aria-label="新建会话" title="新建会话 ⌘N">${icon('compose')}</button>`)}
function picker(){return `<div class="picker"><div class="picker-inner"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><h1>新会话</h1><div class="agent-list">${[['Claude Code','✳','claude'],['Codex','⌘','codex'],['Pi','π','pi']].map(([n,m,c])=>`<button class="agent-tile" data-agent="${n}"><span class="agent-mark ${c}">${n==='Pi'?m:icon(n==='Codex'?'codex-brand':'claude-brand')}</span>${n}</button>`).join('')}</div><div class="picker-foot"><span class="dot" style="background:#cf8064"></span><select aria-label="新会话所属项目" id="new-project">${state.projects.map(p=>`<option ${p===state.project?'selected':''}>${p}</option>`).join('')}</select>${icon('branch')}<select class="mono" aria-label="分支" id="new-branch">${['main','codex/workspace-ui'].map(p=>`<option ${p===state.branch?'selected':''}>${p}</option>`).join('')}</select><label><input type="checkbox" id="new-worktree" ${state.worktree?'checked':''}>worktree</label></div></div></div>`}
function terminal(s){const brand=s.agent==='Claude Code'?'✳':s.agent==='Pi'?'π':'›_';return `<div class="terminal"><div class="brand"><span class="${s.agent==='Claude Code'?'claude':'pi'}">${brand}</span>${s.agent}</div><div class="metadata">~/Projects/${s.project.toLowerCase()} <span class="muted">·</span> ${esc(state.branch)}</div><div class="prompt">❯ ${esc(s.name)}</div><p><span class="bullet">●</span>我先检查当前界面的结构和相关实现。</p><p><span class="success">✓</span> Read <span class="file-ref">WorkspaceSidebarView.swift</span></p><div class="output">已读取项目导航、会话列表与搜索入口。<br>侧栏使用统一的状态标记与选中样式。</div><p><span class="success">✓</span> Read <span class="file-ref">TerminalWorkspaceView.swift</span></p><div class="output">已确认终端画布支持单窗格、分屏与标签页。</div><p>当前工作区由三个部分组成：<br>　1. 项目与会话导航<br>　2. Agent 终端画布<br>　3. 文件、变更与辅助面板</p><p><span class="bullet">●</span>检查完成，可以继续处理下一个任务。</p><form class="terminal-input" data-terminal-form="${s.id}"><span>❯</span><input aria-label="${s.agent} 示例输入" placeholder="输入下一步任务…" autocomplete="off"></form><div class="terminal-hint">? for shortcuts <span style="float:right">示例终端</span></div></div><div class="terminal-note"><span>${s.agent} · ${s.project}</span><span>等待输入</span></div>`}
function pane(s){return `<section class="pane ${state.active===s?.id?'focused':''}" ${s?`data-pane="${s.id}"`:''}>${s&&state.layout!=='tabs'?`<header class="pane-header"><span class="project-chip">${s.project}</span><span class="dot wait"></span><span class="pane-title">${esc(s.name)}</span><span class="grow"></span><span class="shortcut">⌘⇧${state.visible.indexOf(s.id)+1}</span><button class="icon" data-close="${s.id}" aria-label="关闭 ${esc(s.name)}">${icon('close')}</button></header>`:''}${s?terminal(s):picker()}</section>`}
function render(){if(state.empty){renderEmptyProject();return}$('.app').classList.remove('no-project');renderSidebar();$('#project-title').textContent=state.project;$('#layouts').classList.toggle('hidden',!state.visible.length);$('#layout-divider').classList.toggle('hidden',!state.visible.length);$$('[data-layout]').forEach(b=>{b.classList.toggle('active',b.dataset.layout===state.layout);b.setAttribute('aria-pressed',b.dataset.layout===state.layout)});$('#panel-toggles').innerHTML=panelDefs.map(([id,ic,n],i)=>`<button class="icon ${state.panels.includes(id)?'on':''}" data-panel="${id}" aria-label="${n}面板" aria-pressed="${state.panels.includes(id)}" title="${n} ⌘${i+1}">${icon(ic)}</button>`).join('');const shown=state.layout==='split'?state.visible.slice(-2):state.picker?[]:state.visible.filter(id=>id===state.active);$('#canvas').className='canvas'+(state.layout==='split'?' split':'');$('#canvas').innerHTML=shown.map(id=>pane(sessions.find(s=>s.id===id))).join('')+((state.picker||!shown.length)?pane(null):'');$('#tabs').classList.toggle('hidden',state.layout!=='tabs');$('#tabs').innerHTML=state.visible.map(id=>{const s=sessions.find(x=>x.id===id);return `<button class="tab ${state.active===id&&!state.picker?'selected':''}" data-session="${id}"><span class="dot wait"></span><span class="tab-name">${esc(s.name)}</span><span class="tab-close" data-close="${id}" aria-label="关闭标签">×</span></button>`}).join('')+(state.picker?'<button class="tab selected" data-action="new">新会话</button>':'')+`<button class="icon" data-action="new" aria-label="添加会话">${icon('plus')}</button>`;renderPanels()}
const fileRows=['Package.swift','WorkspaceSidebarView.swift','TerminalWorkspaceView.swift','NewSessionPickerView.swift'];
function files(){return `<div class="panel-path">${state.project} / macos</div><div class="tree-row">${icon('chevron')}${icon('folder')}TandockApp</div><div class="tree-row indent">${icon('chevron')}${icon('folder')}Sources</div>${fileRows.map((f,i)=>`<button class="tree-row ${i?'deep':'indent'} ${state.file===f?'selected':''}" data-file="${f}">${icon('file')}<span class="grow">${f}</span>${i===1?'<span class="file-state">M</span>':''}</button>`).join('')}<div class="tree-row">${icon('chevron')}${icon('folder')}Resources</div><button class="tree-row indent" data-file="AppIcon.svg">${icon('file')}AppIcon.svg</button>`}
function changes(){return `<div class="panel-path">${icon('branch')} main <span style="float:right">工作区</span></div><div class="diff-summary">3 个文件<span class="green">+42</span><span class="red">−16</span></div>${['WorkspaceSidebarView.swift','TerminalWorkspaceView.swift','NewSessionPickerView.swift'].map(f=>`<button class="tree-row ${state.file===f?'selected':''}" data-diff="${f}">${icon('file')}<span class="grow">${f}</span><span class="file-state">M</span></button>`).join('')}<div class="diff-summary mono" style="border-top:1px solid var(--line);margin-top:10px">${esc(state.file)}</div><div class="diff"><div class="muted">@@ -24,5 +24,7 @@</div><div>  VStack(spacing: 0) {</div><div class="del">−     sessionList</div><div class="add">+     topBar</div><div class="add">+     ScrollView {</div><div class="add">+         sessionList</div><div class="add">+     }</div><div>      footer</div><div>  }</div></div>`}
function panelContent(id){if(id==='files')return files();if(id==='changes')return changes();if(id==='todo')return `<label class="todo done"><input type="checkbox" checked><span>检查当前界面结构</span></label><label class="todo done"><input type="checkbox" checked><span>统一会话状态样式</span></label><label class="todo"><input type="checkbox"><span>验证分屏与标签页切换</span></label><label class="todo"><input type="checkbox"><span>检查窄窗口显示</span></label>`;return '<div class="shell-output">~/Projects/tandock  main\n\n❯ git status --short\n M WorkspaceSidebarView.swift\n M TerminalWorkspaceView.swift\n M NewSessionPickerView.swift\n\n<span class="success">示例终端 · 不执行实际命令</span></div><form id="shell-form"><input class="shell-input" placeholder="❯ 输入示例命令…" aria-label="辅助终端示例输入"></form>'}
function renderPanels(){$('#panels').classList.toggle('hidden',!state.panels.length);$('#panels').innerHTML=state.panels.map(id=>{const [,ic,n]=panelDefs.find(p=>p[0]===id);return `<section class="panel"><header class="panel-head">${icon(ic)}${n}<span class="count">${id==='changes'?'3':''}</span><span class="grow"></span><button class="icon" data-panel="${id}" aria-label="关闭${n}面板">${icon('close')}</button></header><div class="panel-body">${panelContent(id)}</div></section>`}).join('')}
function showSession(id){const s=sessions.find(x=>x.id===id);state.active=id;state.picker=false;state.project=s.project;if(!state.visible.includes(id))state.visible.push(id);if(state.visible.length>4)state.visible.shift();render()}
function newSession(){if(state.empty){openProjectDialog();return}state.picker=true;if(state.layout==='split'&&state.visible.length>1)state.visible=state.visible.slice(-1);render()}
function togglePanel(id){if(state.empty)return;if(state.panels.includes(id))state.panels=state.panels.filter(p=>p!==id);else{if(state.panels.length===2)state.panels.shift();state.panels.push(id)}render()}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
const commandDefs=[['new','compose','新建会话','⌘N'],['sidebar','sidebar','显示 / 隐藏侧栏','⌘B'],...panelDefs.map(([id,ic,n],i)=>['panel:'+id,ic,'显示 / 隐藏'+n,'⌘'+(i+1)]),['layout:single','single','单窗格',''],['layout:split','split','左右分屏',''],['layout:tabs','tabs','标签页','']];
function renderCommands(){const q=$('#command-search').value.toLowerCase();$('#commands').innerHTML=commandDefs.filter(x=>x[2].toLowerCase().includes(q)).map(([a,ic,n,k])=>`<button class="command" data-command="${a}">${icon(ic)}${n}<span class="grow"></span><kbd>${k}</kbd></button>`).join('')||'<div class="no-results">没有匹配的命令</div>'}
function dismiss(){$('#overlay').classList.add('hidden');returnFocus?.focus()}
function action(a){if(a==='new')newSession();else if(a==='sidebar'){$('.sidebar').classList.toggle(innerWidth<920?'mobile-open':'closed')}else if(a==='commands'){returnFocus=document.activeElement;$('#overlay').classList.remove('hidden');$('#command-search').value='';renderCommands();$('#command-search').focus()}else if(a==='dismiss')dismiss();else if(a==='filter'){state.filter=!state.filter;renderSidebar()}else if(a==='add-project')openProjectDialog();else if(a==='dismiss-project')dismissProject()}
function layout(l){if(state.empty)return;state.layout=l;if(!state.visible.length){state.visible=[1];state.active=1;state.picker=false}if(l==='split'){if(state.visible.length<2)state.visible.push(state.visible[0]===2?1:2);state.picker=false}render()}
document.addEventListener('click',e=>{const paneElement=e.target.closest('[data-pane]');if(paneElement){state.active=Number(paneElement.dataset.pane);$$('[data-pane]').forEach(p=>p.classList.toggle('focused',p===paneElement))}const b=e.target.closest('button,[data-close]');if(!b)return;if(b.dataset.close){const id=Number(b.dataset.close);state.visible=state.visible.filter(x=>x!==id);if(state.active===id)state.active=state.visible.at(-1)||null;state.picker=!state.visible.length;render();return}if(b.dataset.openProject){adoptDemoProject(b.dataset.openProject);return}if(b.dataset.action)action(b.dataset.action);else if(b.dataset.session)showSession(Number(b.dataset.session));else if(b.dataset.collapse){const s=b.closest('.section');s.classList.toggle('collapsed');b.setAttribute('aria-expanded',!s.classList.contains('collapsed'))}else if(b.dataset.project){state.project=b.dataset.project;if(collapsedProjects.has(state.project))collapsedProjects.delete(state.project);else collapsedProjects.add(state.project);render()}else if(b.dataset.agent){const id=Math.max(...sessions.map(s=>s.id))+1;sessions.unshift({id,name:'新会话',project:state.project,agent:b.dataset.agent,status:'wait',time:'现在'});showSession(id)}else if(b.dataset.layout)layout(b.dataset.layout);else if(b.dataset.panel)togglePanel(b.dataset.panel);else if(b.dataset.file){state.file=b.dataset.file;renderPanels();toast('已选择 '+state.file+' · 文件内容为设计示例')}else if(b.dataset.diff){state.file=b.dataset.diff;renderPanels()}else if(b.dataset.command){dismiss();const c=b.dataset.command;if(c.startsWith('panel:'))togglePanel(c.split(':')[1]);else if(c.startsWith('layout:'))layout(c.split(':')[1]);else action(c)}});
$('#session-search').addEventListener('input',renderSidebar);$('#command-search').addEventListener('input',renderCommands);$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))dismiss()});
document.addEventListener('change',e=>{if(e.target.id==='new-project'){state.project=e.target.value;$('#project-title').textContent=state.project;renderSidebar()}if(e.target.id==='new-branch')state.branch=e.target.value;if(e.target.id==='new-worktree')state.worktree=e.target.checked;if(e.target.closest('.todo'))e.target.closest('.todo').classList.toggle('done',e.target.checked)});
document.addEventListener('submit',e=>{e.preventDefault();const input=e.target.querySelector('input');if(!input.value.trim())return;const line=document.createElement('p');line.textContent='❯ '+input.value;line.className='prompt';if(e.target.id==='shell-form'){e.target.previousElementSibling.append(line)}else{e.target.before(line)}input.value='';toast('已展示示例输入；设计稿不会连接或运行 Agent。')});
document.addEventListener('keydown',e=>{const open=!$('#overlay').classList.contains('hidden');if(e.key==='Escape'&&open){dismiss();return}if(open&&e.key==='Tab'){const items=[...$('#overlay').querySelectorAll('input,button')];const i=items.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&i===items.length-1){e.preventDefault();items[0].focus()}}if(open&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){const items=$$('#commands button');if(!items.length)return;e.preventDefault();const i=items.indexOf(document.activeElement);if(e.key==='Enter')(items[i<0?0:i]).click();else items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();return}if(!(e.metaKey||e.ctrlKey))return;const key=e.key.toLowerCase();if(key==='o'){e.preventDefault();openProjectDialog();return}if(['n','b','k','1','2','3','4'].includes(key)){e.preventDefault();if(key==='n')newSession();else if(key==='b')action('sidebar');else if(key==='k')action('commands');else togglePanel(panelDefs[Number(key)-1][0])}});

function renderEmptyProject(){
 $('.app').classList.add('no-project');renderSidebar();$('#project-title').textContent='Tandock';
 $('#tabs').classList.add('hidden');$('#panels').classList.add('hidden');$('#canvas').className='canvas';
 $('#canvas').innerHTML=`<section class="pane"><div class="empty-project"><div class="empty-content"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><h1>从一个项目开始</h1><p class="empty-intro">打开项目文件夹，<br>让 Agent 和你一起推进工作。</p><button class="open-project-button" data-action="add-project">${icon('folder')}打开文件夹…<kbd>⌘O</kbd></button><button class="folder-drop" data-action="add-project" aria-label="将项目文件夹拖到这里，或点击选择">${icon('folder')}<strong>也可以将文件夹拖到这里</strong><span>已有仓库或普通文件夹均可</span></button><p class="empty-next">添加后选择 Agent，即可开始会话。<br>项目文件保留在原来的位置。</p></div></div></section>`;
 const drop=$('.folder-drop');
 drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragging')});
 drop.addEventListener('dragleave',()=>drop.classList.remove('dragging'));
 drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('dragging');openProjectDialog()});
}
function openProjectDialog(){returnFocus=document.activeElement;$('#project-overlay').classList.remove('hidden');$('#project-overlay [data-open-project]').focus()}
function dismissProject(){$('#project-overlay').classList.add('hidden');returnFocus?.focus()}
function adoptDemoProject(name){
 dismissProject();if(state.empty){sessions.splice(0);state.projects=[];state.visible=[];state.active=null;state.panels=[];state.layout='single'}
 if(!state.projects.includes(name))state.projects.push(name);state.empty=false;history.replaceState(null,'','#workspace');state.project=name;state.picker=true;collapsedProjects.delete(name);render();$('#canvas .agent-tile')?.focus();
}
$('#project-overlay').addEventListener('click',e=>{if(e.target===$('#project-overlay'))dismissProject()});
document.addEventListener('dragover',e=>{if(state.empty)e.preventDefault()});
document.addEventListener('drop',e=>{if(state.empty){e.preventDefault();if(!e.target.closest('.folder-drop'))openProjectDialog()}});
document.addEventListener('keydown',e=>{
 if($('#project-overlay').classList.contains('hidden'))return;
 if(e.key==='Escape'){e.preventDefault();dismissProject()}
 if(e.key==='Tab'){const items=[...$('#project-overlay').querySelectorAll('button')];const i=items.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&i===items.length-1){e.preventDefault();items[0].focus()}}
},true);
window.addEventListener('hashchange',()=>{state.empty=location.hash==='#empty';if(!state.empty){sessions.splice(0,sessions.length,...sampleSessions.map(s=>({...s})));state.projects=['Tandock','BlinkFar'];state.project='Tandock'}state.visible=[];state.active=null;state.panels=[];state.picker=true;state.layout='single';render()});

render();
</script>
</body>
</html>
