[package]
name = "ycode-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Tauri command/event surface — protocol between ycode core and the webview."

[dependencies]
ycode-config.workspace = true
ycode-introspect.workspace = true
ycode-lsp.workspace = true
ycode-persist.workspace = true
ycode-terminal.workspace = true
base64 = "0.22"
camino.workspace = true
ignore = { workspace = true }
notify = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
ulid.workspace = true
uuid = { version = "1.11", features = ["v4"] }

# Process-liveness check (kill(pid, 0)) for orphaned-socket cleanup.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["full", "test-util"] }
