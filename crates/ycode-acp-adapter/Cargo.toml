[package]
name = "ycode-acp-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ACP (Agent Client Protocol) adapter — drives Claude Code, Gemini CLI, and any ACP-compliant agent."

[[bin]]
name = "fake_acp_agent"
path = "src/bin/fake_acp_agent.rs"
# Used as the server side of the loopback integration test. Not a public
# binary — `publish = false` at the workspace level ensures it doesn't ship.

[dependencies]
ycode-adapter.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
camino.workspace = true

[dev-dependencies]
tempfile = "3.10"
ycode-core.workspace = true
ycode-persist.workspace = true
tracing-subscriber.workspace = true
