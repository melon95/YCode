[package]
name = "ycode-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri shell — thin glue between webview commands and ycode-ipc::Service."

[lib]
name = "ycode_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ycode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ycode-adapter.workspace = true
ycode-acp-adapter.workspace = true
ycode-pty-adapter.workspace = true
ycode-echo-adapter.workspace = true
ycode-config.workspace = true
ycode-core.workspace = true
ycode-ipc.workspace = true
ycode-persist.workspace = true
ycode-worktree.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
camino.workspace = true
directories = "5"
anyhow.workspace = true
